<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas — Monitor n8n</title><script src="/theme.js"></script><link rel="stylesheet" href="/base.css"><style>
body{overflow:hidden}.app{height:100vh;width:98%;max-width:none;margin:auto;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}.topo,.filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filtros{border:1px solid var(--linha);background:var(--cartao);padding:8px 10px;border-radius:8px}.grupo{display:flex;align-items:center;gap:5px}.rot{font-size:10px;text-transform:uppercase;color:var(--ink3);letter-spacing:.07em}.conteudo{min-height:0;overflow:auto}.lista{width:100%}.lista td{padding:9px}.titulo-t{font-weight:620}.nota{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}.kanban{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:8px;min-height:100%;min-width:1450px}.coluna{background:var(--grid);border:1px solid var(--linha);border-radius:8px;padding:7px;min-height:200px}.coluna.over{outline:2px solid var(--calmo)}.col-cab{display:flex;align-items:center;gap:7px;padding:3px 3px 8px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink2)}.card{background:var(--cartao);border:1px solid var(--linha);border-left:3px solid var(--ink3);border-radius:7px;padding:9px;margin-bottom:7px;cursor:grab}.card.ruim{border-left-color:var(--ruim)}.card.atencao{border-left-color:var(--atencao)}.card h3{font-size:12.5px;margin:5px 0}.card .sub{font-size:11px;color:var(--ink3)}.card .acoes{display:flex;gap:6px;margin-top:8px}.card button{padding:3px 7px}.vazio-col{font-size:11px;color:var(--ink3);padding:8px;text-align:center}.hist{max-height:180px;overflow:auto;border-top:1px solid var(--linha);margin-top:14px;padding-top:8px}.hist div{font-size:11px;color:var(--ink3);padding:3px 0}@media(max-width:900px){body{overflow:auto}.app{height:auto}.conteudo{overflow:auto}}
</style></head><body><main class="app">
<header class="topo"><nav class="nav"><a href="/">Monitor</a><a class="atual" href="/tarefas">Tarefas</a><a href="/dashboard">Dashboard</a><a href="/logs">Logs</a></nav><span id="status"><span class="ponto"></span><span id="statusNome">carregando</span></span><span class="cresce"></span><span class="meta" id="resumo"></span><span class="versao" data-versao title="n8n-monitor"></span><div class="sessao" id="sessao"></div><button id="btAtualizar">Atualizar</button></header>
<section class="filtros"><div class="grupo" id="fInst"><span class="rot">Instâncias</span></div><span class="cresce"></span><div class="nav"><a href="#" id="modoLista">Lista</a><a href="#" id="modoKanban">Kanban</a></div></section>
<section class="conteudo" id="conteudo"></section></main>
<dialog id="dlg" aria-labelledby="dTitulo"><div class="dlg" style="width:min(620px,calc(100vw - 40px))"><h3 id="dTitulo"></h3><div id="dMeta" class="obs"></div><label for="dEstado">Status</label><select id="dEstado"></select><label for="dNota">Nota</label><textarea id="dNota" rows="5" placeholder="Contexto, responsável, próxima ação..."></textarea><div class="hist" id="dHist"></div><div class="linha-btn"><a id="dLink" target="_blank" rel="noopener noreferrer">Abrir origem</a><span class="cresce"></span><button id="dFechar">Fechar</button><button id="dSalvar">Salvar</button></div></div></dialog>
<script src="/i18n.js"></script>
<script src="/rede.js"></script>
<script src="/sessao.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=i=>i?new Date(i).toLocaleString(I18n.locale()):'—'
const ROT={analise:'Em análise',aguardando:'Aguardando',corrigindo:'Corrigindo',corrigido:'Corrigido',producao:'Em produção',resolvido:'Resolvido'}
const tr=s=>I18n.t(s),rot=e=>tr(ROT[e])
let dados=null,modo=localStorage.getItem('n8nmon.tarefas.modo')||'lista',filtro=new Set(),aberta=null
const visiveis=()=>dados.itens.filter(t=>!filtro.size||filtro.has(t.instanciaId))
function status(n,r){$('#status').className=n;$('#statusNome').textContent=r}
function filtros(){const el=$('#fInst');el.innerHTML='<span class="rot">Instâncias</span>'+dados.instancias.map(i=>`<button class="tag ${filtro.has(i.id)?'on':''}" data-inst="${esc(i.id)}">${esc(i.nome)}</button>`).join('');el.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{filtro.has(b.dataset.inst)?filtro.delete(b.dataset.inst):filtro.add(b.dataset.inst);filtros();render()})}
function seletor(t){return `<select data-estado="${esc(t.chave)}">${dados.estados.map(e=>`<option value="${e}" ${e===t.estado?'selected':''}>${ROT[e]}</option>`).join('')}</select>`}
function renderLista(L){$('#conteudo').innerHTML=`<div class="painel"><div class="corpo"><table class="lista"><thead><tr><th>Tarefa</th><th>Instância</th><th>Status</th><th>Nota</th><th>Atualizada</th><th></th></tr></thead><tbody>${L.map(t=>`<tr><td><div class="titulo-t">${esc(t.fluxo||tr(t.tipo))}</div><div class="sub2">${esc(tr(t.tipo))} · ×${t.magnitude||1}</div></td><td><span class="tag">${esc(t.instancia||'—')}</span></td><td>${seletor(t)}</td><td><div class="nota">${esc(t.nota||'—')}</div></td><td class="n">${dt(t.atualizadoEm)}</td><td><button data-open="${esc(t.chave)}">Detalhes</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-estado]').forEach(s=>s.onchange=()=>mover(s.dataset.estado,s.value))}
function card(t){return `<article class="card ${t.nivel||''}" draggable="true" data-card="${esc(t.chave)}"><span class="tag">${esc(t.instancia||tr('sem instância'))}</span><h3>${esc(t.fluxo||tr(t.tipo))}</h3><div class="sub">${esc(tr(t.tipo))} · ×${t.magnitude||1}</div>${t.nota?`<div class="sub" style="margin-top:5px">${esc(t.nota)}</div>`:''}<div class="acoes"><button data-open="${esc(t.chave)}">Detalhes</button>${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">abrir →</a>`:''}</div></article>`}
function renderKanban(L){$('#conteudo').innerHTML='<div class="kanban">'+dados.estados.map(e=>{const x=L.filter(t=>t.estado===e);return `<section class="coluna" data-col="${e}"><div class="col-cab">${ROT[e]}<span class="cresce"></span><span class="tag">${x.length}</span></div>${x.map(card).join('')||'<div class="vazio-col">Nenhuma tarefa</div>'}</section>`}).join('')+'</div>';document.querySelectorAll('[data-card]').forEach(c=>c.ondragstart=ev=>ev.dataTransfer.setData('text/plain',c.dataset.card));document.querySelectorAll('[data-col]').forEach(c=>{c.ondragover=ev=>{ev.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=ev=>{ev.preventDefault();c.classList.remove('over');mover(ev.dataTransfer.getData('text/plain'),c.dataset.col)}})}
function render(){const L=visiveis();$('#resumo').textContent=`${L.length} tarefa(s) · ${L.filter(x=>x.estado!=='resolvido').length} aberta(s)`;$('#modoLista').className=modo==='lista'?'atual':'';$('#modoKanban').className=modo==='kanban'?'atual':'';modo==='lista'?renderLista(L):renderKanban(L);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>abrir(b.dataset.open))}
async function carregar(){try{const d=await Rede.json('tarefas','/api/tarefas');if(!d)return;dados=d;status('ok','conectado');filtros();render()}catch(e){if(Rede.abortado(e))return;status('ruim','painel offline')}}
async function mover(chave,estado,nota){await fetch('/api/tarefas',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chave,estado,nota})});await carregar()}
function abrir(chave){aberta=dados.itens.find(t=>t.chave===chave);$('#dTitulo').textContent=aberta.fluxo||aberta.tipo;$('#dMeta').textContent=`${aberta.instancia||tr('sem instância')} · ${tr('criada')} ${dt(aberta.criadoEm)} · ${tr('vista')} ${dt(aberta.vistoEm)}`;$('#dEstado').innerHTML=dados.estados.map(e=>`<option value="${e}" ${e===aberta.estado?'selected':''}>${rot(e)}</option>`).join('');$('#dNota').value=aberta.nota||'';$('#dLink').href=aberta.link||'#';$('#dLink').hidden=!aberta.link;$('#dHist').innerHTML='<b>'+tr('Histórico')+'</b>'+(aberta.historico||[]).slice().reverse().map(h=>`<div>${dt(h.em)} · ${h.de?rot(h.de)+' → ':''}${rot(h.para)}${h.motivo?' · '+tr(h.motivo):''}</div>`).join('');$('#dlg').showModal()}
$('#dSalvar').onclick=async()=>{await mover(aberta.chave,$('#dEstado').value,$('#dNota').value);$('#dlg').close()};$('#dFechar').onclick=()=>$('#dlg').close();$('#btAtualizar').onclick=carregar
$('#modoLista').onclick=ev=>{ev.preventDefault();modo='lista';localStorage.setItem('n8nmon.tarefas.modo',modo);render()};$('#modoKanban').onclick=ev=>{ev.preventDefault();modo='kanban';localStorage.setItem('n8nmon.tarefas.modo',modo);render()}
carregar();setInterval(carregar,30000)
Sessao.carregar().then(s=>Sessao.montar(document.getElementById('sessao'),s))
</script></body></html>
