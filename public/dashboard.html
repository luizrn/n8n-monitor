<!doctype html>
<!-- Desenvolvido por Luiz Fernando Riva Nekel -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Monitor n8n</title>
<link rel="stylesheet" href="/base.css">
<style>
  body{overflow:hidden}
  .app{height:100vh;width:98%;max-width:none;margin:0 auto;padding:12px;
    display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:10px}
  .topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .nums{grid-template-columns:repeat(6,1fr)}
  .grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
  @media (max-width:1150px){
    body{overflow:auto} .app{height:auto}
    .grade{grid-template-columns:1fr} .nums{grid-template-columns:repeat(3,1fr)}
  }
  .aviso{background:color-mix(in oklab,var(--atencao) 10%,var(--cartao));
    border:1px solid color-mix(in oklab,var(--atencao) 35%,transparent);
    border-radius:10px;padding:8px 13px;font-size:12.5px;color:var(--ink2)}
  .barrinha{display:flex;align-items:center;gap:7px}
  .barrinha .t{flex:1}
  .dist{display:flex;gap:2px;height:9px;border-radius:5px;overflow:hidden;margin:4px 0 9px}
  .dist span{height:100%}
  .legd{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink2)}
  .legd i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
</style>
</head>
<body>
<div class="app">

  <div class="topo">
    <nav class="nav">
      <a href="/">Monitor</a>
      <a href="/tarefas">Tarefas</a>
      <a href="/dashboard" class="atual">Dashboard</a>
      <a href="/logs">Logs</a>
    </nav>
    <span id="status"><span class="ponto"></span><span id="statusNome">carregando</span></span>
    <span class="cresce"></span>
    <div class="grupo" id="fInst"></div>
    <div class="grupo" id="periodo"></div>
    <button id="btCopiar">Copiar resumo</button>
  </div>

  <div class="nums" id="nums"></div>

  <div id="avisoCobertura"></div>

  <div class="grade">
    <div class="painel" style="grid-column:1 / -1;max-height:230px">
      <div class="cab">Execuções ao longo do período<span class="cresce"></span>
        <span class="meta" id="passo"></span></div>
      <div class="corpo semrolar">
        <div class="legd" style="margin-bottom:6px">
          <span><i style="background:var(--calmo)"></i>concluídas</span>
          <span><i style="background:var(--ruim)"></i>com erro</span>
        </div>
        <div id="grafico"></div>
      </div>
    </div>

    <div class="painel">
      <div class="cab">Maior volume</div>
      <div class="corpo"><table id="tbVolume"></table></div>
    </div>

    <div class="painel">
      <div class="cab">Mais falhas</div>
      <div class="corpo"><table id="tbFalhas"></table></div>
    </div>

    <div class="painel">
      <div class="cab">Mais lentos <span class="meta">p95</span></div>
      <div class="corpo"><table id="tbLentos"></table></div>
    </div>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
const $ = s => document.querySelector(s)
const tr = (s,v) => I18n.t(s,v)
const nf = n => new Intl.NumberFormat(I18n.locale()).format(n)
const pc = n => (n*100).toFixed(n >= 0.1 ? 0 : 1) + '%'
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const dms = ms => {
  if (ms == null) return '—'
  if (ms < 1000) return ms + 'ms'
  const s = ms/1000
  if (s < 60) return s.toFixed(1) + 's'
  const m = Math.floor(s/60)
  return m < 60 ? `${m}m ${Math.round(s%60)}s` : `${Math.floor(m/60)}h ${m%60}m`
}
const rotulo = i => {
  const d = new Date(i)
  return ultimo && ultimo.passoMin >= 60
    ? d.toLocaleString(I18n.locale(),{day:'2-digit',hour:'2-digit'}).replace(',','')
    : d.toLocaleTimeString(I18n.locale(),{hour:'2-digit',minute:'2-digit'})
}

let horas = 24, ultimo = null, instancias = new Set()
function pintarStatus(n,r){ $('#status').className=n; $('#statusNome').textContent=r }

function periodos(){
  $('#periodo').innerHTML = [1,6,24,72,168].map(h =>
    `<button class="chip ${h===horas?'on':''}" data-h="${h}">${h<24?h+'h':(h/24)+'d'}</button>`).join('')
  $('#periodo').querySelectorAll('button').forEach(b =>
    b.onclick = () => { horas = Number(b.dataset.h); periodos(); puxar() })
}

function nums(k, d){
  const cs = [
    ['execuções', nf(k.total), ''],
    ['erros', nf(k.erros), k.erros?'mal':'bem'],
    ['taxa de erro', pc(k.taxaErro), k.taxaErro>0.02?'mal':k.taxaErro?'aviso':'bem'],
    ['fluxos ativos', nf(k.fluxosAtivos), ''],
    ['duração mediana', dms(k.medianaMs), ''],
    ['duração p95', dms(k.p95Ms), ''],
  ]
  $('#nums').innerHTML = cs.map(([r,v,c])=>`<div class="num ${c}"><div class="r">${r}</div><div class="v">${v}</div></div>`).join('')
}

function grafico(serie){
  const L=32,B=17,T=6,R=6,A=150
  const el=$('#grafico'); const W=Math.max(320, el.clientWidth||600)
  const max=Math.max(1,...serie.map(d=>d.ok+d.erro))
  const bw=(W-L-R)/serie.length, larg=Math.max(2,bw-2)
  const y=v=>T+(A-T-B)*(1-v/max)
  let g=''
  for(const v of [...new Set([0,Math.ceil(max/2),max])]){
    g+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`
    g+=`<text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--ink3)">${nf(v)}</text>`
  }
  serie.forEach((d,i)=>{
    const x=L+i*bw+(bw-larg)/2, tot=d.ok+d.erro
    if(!tot) return
    const hOk=(A-T-B)*d.ok/max, hEr=(A-T-B)*d.erro/max, base=A-B
    const t=`${rotulo(d.t)} — ${nf(d.ok)} ok${d.erro?`, ${nf(d.erro)} erro`:''}`
    if(d.erro) g+=`<rect x="${x}" y="${base-hEr-(d.ok?hOk+2:0)}" width="${larg}" height="${Math.max(2,hEr)}" rx="2" fill="var(--ruim)"><title>${t}</title></rect>`
    if(d.ok)  g+=`<rect x="${x}" y="${base-hOk}" width="${larg}" height="${Math.max(2,hOk)}" rx="2" fill="var(--calmo)"><title>${t}</title></rect>`
  })
  if(serie.length){
    g+=`<text x="${L}" y="${A-4}" font-size="9.5" fill="var(--ink3)">${rotulo(serie[0].t)}</text>`
    g+=`<text x="${W-R}" y="${A-4}" text-anchor="end" font-size="9.5" fill="var(--ink3)">agora</text>`
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${A}" width="100%" height="${A}" preserveAspectRatio="none" role="img" aria-label="execuções ao longo do período">${g}</svg>`
}

function tabela(alvo, linhas, colunas, maxV){
  if(!linhas.length){ $(alvo).innerHTML=`<tbody><tr><td class="vazio">Nada no período.</td></tr></tbody>`; return }
  $(alvo).innerHTML = '<thead><tr>'+colunas.map(c=>`<th>${c.t}</th>`).join('')+'</tr></thead><tbody>'+
    linhas.map(l=>'<tr>'+colunas.map(c=>c.f(l,maxV)).join('')+'</tr>').join('')+'</tbody>'
}

const baseDe = id => ultimo.instancias.find(i=>i.id===id)?.baseUrl || ''
const celFluxo = l => `<td><a href="${esc(baseDe(l.instanciaId))}/workflow/${esc(l.workflowId)}" target="_blank" rel="noopener noreferrer">${esc(l.fluxo)}</a><div class="sub2"><span class="tag">${esc(l.instancia)}</span></div></td>`

function filtrosInst(d){
  $('#fInst').innerHTML=d.instancias.length>1?'<span class="meta">instâncias</span>'+d.instancias.map(i=>`<button class="tag ${instancias.has(i.id)?'on':''}" data-inst="${esc(i.id)}">${esc(i.nome)}</button>`).join(''):''
  document.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{instancias.has(b.dataset.inst)?instancias.delete(b.dataset.inst):instancias.add(b.dataset.inst);puxar()})
}

async function puxar(){
  try{
    const p=new URLSearchParams({horas:String(horas)});if(instancias.size)p.set('instancias',[...instancias].join(','))
    const d = await (await fetch('/api/dashboard?'+p,{cache:'no-store'})).json()
    if(!d.ok){
      pintarStatus('ruim', d.motivo==='sem-chave'?'não configurado':'sem dados')
      return
    }
    pintarStatus('ok','conectado')
    ultimo = d
    filtrosInst(d)
    nums(d.kpis, d)
    $('#passo').textContent = d.passoMin >= 60 ? 'por hora' : `por ${d.passoMin} min`
    grafico(d.serie)

    // Honestidade sobre a janela: pedir 7 dias não cria histórico que a
    // retenção já apagou. O aviso evita ler o gráfico como se fosse o período.
    const pedido = horas, real = d.coberturaHoras
    $('#avisoCobertura').innerHTML = (real && real < pedido * 0.9)
      ? `<div class="aviso">${tr('Período pedido: {pedido}h. O banco só guarda',{pedido})} <b>${real}h</b> ${tr('de execuções')} —
         ${tr('os números abaixo cobrem esse intervalo, não o período inteiro.')}
         ${tr('Aumente EXECUTIONS_DATA_PRUNE_MAX_COUNT para enxergar mais longe.').replace('EXECUTIONS_DATA_PRUNE_MAX_COUNT','<code>EXECUTIONS_DATA_PRUNE_MAX_COUNT</code>')}</div>`
      : ''

    const maxTotal = Math.max(1, ...d.volume.map(f=>f.total))
    tabela('#tbVolume', d.volume, [
      {t:'Fluxo', f:celFluxo},
      {t:'Exec.', f:l=>`<td class="n">${nf(l.total)}<div class="trilho"><div class="barra" style="width:${(l.total/maxTotal*100).toFixed(1)}%"></div></div></td>`},
      {t:'Erro', f:l=>`<td class="n">${l.erros?`<span class="tag ruim">${pc(l.taxaErro)}</span>`:'—'}</td>`},
    ])

    const maxErr = Math.max(1, ...d.falhas.map(f=>f.erros))
    tabela('#tbFalhas', d.falhas, [
      {t:'Fluxo', f:celFluxo},
      {t:'Erros', f:l=>`<td class="n">${nf(l.erros)}<div class="trilho"><div class="barra mal" style="width:${(l.erros/maxErr*100).toFixed(1)}%"></div></div></td>`},
      {t:'Taxa', f:l=>`<td class="n">${pc(l.taxaErro)}</td>`},
    ])

    tabela('#tbLentos', d.lentos, [
      {t:'Fluxo', f:celFluxo},
      {t:'p95', f:l=>`<td class="n">${dms(l.p95Ms)}</td>`},
      {t:'Mediana', f:l=>`<td class="n">${dms(l.medianaMs)}</td>`},
    ])
  } catch { pintarStatus('ruim','painel offline') }
}

$('#btCopiar').onclick = async ev => {
  if(!ultimo) return
  const k = ultimo.kpis
  const L = [`# Dashboard n8n — ${tr('últimas')} ${ultimo.horas}h`, '',
    `${tr('Cobertura real do banco')}: ${ultimo.coberturaHoras}h`, '',
    `- ${tr('execuções')}: ${nf(k.total)} · ${tr('erros')}: ${nf(k.erros)} (${pc(k.taxaErro)})`,
    `- ${tr('fluxos ativos')}: ${nf(k.fluxosAtivos)}`,
    `- ${tr('duração mediana')}: ${dms(k.medianaMs)} · p95: ${dms(k.p95Ms)}`, '',
    `## ${tr('Maior volume')}`, ...ultimo.volume.map(f=>`- ${f.fluxo}: ${nf(f.total)} exec, ${pc(f.taxaErro)} ${tr('erro')}`), '',
    `## ${tr('Mais falhas')}`, ...(ultimo.falhas.length?ultimo.falhas.map(f=>`- ${f.fluxo}: ${nf(f.erros)} ${tr('erros')} de ${nf(f.total)} (${pc(f.taxaErro)})`):['- '+tr('nenhum')]), '',
    `## ${tr('Mais lentos')} (p95)`, ...ultimo.lentos.map(f=>`- ${f.fluxo}: p95 ${dms(f.p95Ms)}, ${tr('Mediana').toLowerCase()} ${dms(f.medianaMs)}`)]
  const t = L.join('\n')
  try{ await navigator.clipboard.writeText(t) }
  catch{ const x=document.createElement('textarea'); x.value=t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove() }
  const a=ev.target.textContent; ev.target.textContent='Copiado ✓'; setTimeout(()=>ev.target.textContent=a,1500)
}

addEventListener('resize', ()=>{ if(ultimo) grafico(ultimo.serie) })
periodos(); puxar(); setInterval(puxar, 30000)
</script>
</body>
</html>
