<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor n8n</title>
<link rel="stylesheet" href="/base.css">
<style>
body{overflow:hidden}.app{width:100%;min-width:0;height:100vh;max-width:1720px;margin:auto;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.app>*{min-width:0}.topo{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao)}
.placar{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.placar .icone{font-size:28px}.placar .numero{font-size:30px;font-weight:700}.placar .titulo{font-weight:650}.placar .resumo{width:clamp(180px,28vw,520px);flex:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo.ruim{border-color:color-mix(in oklab,var(--ruim) 55%,var(--linha));background:color-mix(in oklab,var(--ruim) 8%,var(--cartao))}.topo.atencao{border-color:color-mix(in oklab,var(--atencao) 55%,var(--linha));background:color-mix(in oklab,var(--atencao) 8%,var(--cartao))}
.filtros-inst{display:flex;align-items:center;gap:6px;min-height:28px}.filtros-inst .rot{font-size:10px;text-transform:uppercase;color:var(--ink3);letter-spacing:.08em}
.grade{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(390px,1fr);gap:10px;min-height:0}.grade>*{min-width:0}.lateral{display:grid;grid-template-rows:auto auto minmax(100px,1fr) auto;gap:10px;min-width:0;min-height:0}.nums{grid-template-columns:repeat(4,1fr)}
.prob{border:1px solid var(--linha);border-left:4px solid var(--ink3);border-radius:8px;padding:11px 13px;margin-bottom:8px;background:var(--sup)}.prob.ruim{border-left-color:var(--ruim)}.prob.atencao{border-left-color:var(--atencao)}
.prob-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.prob .tipo{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink3)}.prob.ruim .tipo{color:var(--ruim)}.prob.atencao .tipo{color:var(--atencao)}.prob h3{font-size:14px;margin:4px 0 0}.prob .det{font-size:12px;color:var(--ink2);margin-top:3px}.acoes{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.exec{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--linha);font-size:12px}.exec:first-child{border-top:0}.exec .tempo{min-width:62px;font-variant-numeric:tabular-nums}.exec .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.girando{width:9px;height:9px;border:2px solid var(--calmo);border-top-color:transparent;border-radius:50%;animation:gira .9s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.uptime-resumo{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:7px;overflow:hidden}.uptime-kpi{background:var(--cartao);padding:7px;text-align:center}.uptime-kpi b{display:block;font-size:18px}.uptime-kpi span{font-size:9px;text-transform:uppercase;color:var(--ink3)}
.cron-resumo{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.cron-resumo b{font-variant-numeric:tabular-nums}
.config{width:min(880px,calc(100vw - 30px))}.tabs{display:flex;border-bottom:1px solid var(--linha);gap:2px;margin:12px 0}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0}.tabs button.on{color:var(--calmo);border-bottom-color:var(--calmo)}.aba[hidden]{display:none}
.inst-row{display:grid;grid-template-columns:auto minmax(120px,.7fr) minmax(180px,1fr) minmax(150px,1fr) auto auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha)}.inst-row input{width:100%}.switch-line{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--linha)}.switch-line input[type=range]{width:min(320px,45vw)}
.monitor-lista{max-height:260px;overflow:auto;border:1px solid var(--linha);border-radius:7px;margin-top:10px}.monitor-op{display:flex;align-items:center;gap:8px;padding:7px 9px;border-top:1px solid var(--linha)}.monitor-op:first-child{border-top:0}.monitor-op .alvo{margin-left:auto;color:var(--ink3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%}.monitor-vinculo{min-width:78px;font-size:10px;color:var(--bom)}.monitor-vinculo.fora{color:var(--ink3)}
.modal-table td,.modal-table th{padding:8px}.estado{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}.dot.ligado{background:var(--pontoBom)}.dot.desligado{background:var(--pontoRuim)}.dot.desconhecido{background:var(--pontoAtencao)}
@media(max-width:1050px){body{overflow:auto}.app{height:auto}.grade{grid-template-columns:1fr}.lateral{grid-template-rows:auto}.inst-row{grid-template-columns:auto 1fr}.inst-row input{grid-column:2}.uptime-resumo{grid-template-columns:repeat(5,minmax(65px,1fr))}}
@media(max-width:700px){.topo{flex-wrap:wrap}.topo .nav{flex:1 0 100%;justify-content:space-between;overflow-x:auto}.placar{flex:1 0 100%}.placar .resumo{display:none}.topo .meta{margin-left:auto}.tabs{overflow-x:auto}.tabs button{white-space:nowrap}}
</style>
</head>
<body>
<main class="app">
  <header class="topo" id="topo">
    <nav class="nav"><a class="atual" href="/">Monitor</a><a href="/tarefas">Tarefas <span id="tarefasN"></span></a><a href="/dashboard">Dashboard</a><a href="/logs">Logs</a></nav>
    <div class="placar"><span class="icone" id="icone">…</span><span class="numero" id="numero"></span><span class="titulo" id="titulo">carregando</span><span class="resumo" id="resumo"></span></div>
    <span id="status"><span class="ponto"></span><span id="statusNome">conectando</span></span>
    <span class="meta" id="quando"></span><button id="btPausa">Pausar</button><button id="btConfig">Configurações</button>
  </header>
  <div class="filtros-inst" id="fInst"></div>
  <section class="grade">
    <div class="painel"><div class="cab">O que precisa de atenção<span class="cresce"></span><span class="meta" id="contaProb"></span></div><div class="corpo" id="problemas"></div></div>
    <aside class="lateral">
      <div class="nums" id="nums"></div>
      <div class="painel"><div class="cab">Uptime Kuma<span class="cresce"></span><button id="btUptime">Detalhes</button></div><div class="corpo semrolar" id="uptime"></div></div>
      <div class="painel"><div class="cab">Em andamento<span class="cresce"></span><span class="meta" id="contaAndando"></span></div><div class="corpo" id="andando"></div></div>
      <div class="painel"><div class="cab">Agendamentos<span class="cresce"></span><button id="btCron">Tabela</button></div><div class="corpo semrolar" id="cronResumo"></div></div>
    </aside>
  </section>
</main>

<dialog id="dlgConfig"><div class="dlg config"><h3>Configurações</h3><div class="obs" id="caminho"></div>
  <div class="tabs" id="tabs"><button data-aba="inst" class="on">Instâncias n8n</button><button data-aba="notif">Notificações</button><button data-aba="kuma">Uptime Kuma</button><button data-aba="webhook">Webhook</button></div>
  <section class="aba" id="aba-inst"><div id="instancias"></div><button id="btAddInst">Adicionar instância</button></section>
  <section class="aba" id="aba-notif" hidden>
    <div class="switch-line"><span>Fechar toast automaticamente</span><span><input id="toastSeg" type="range" min="0" max="600" step="10"><b id="toastVal"></b></span></div>
    <label class="switch-line"><span>Notificações do navegador</span><input id="notifNav" type="checkbox"></label>
    <label class="switch-line"><span>Som em alertas vermelhos</span><input id="notifSom" type="checkbox"></label>
    <div class="switch-line"><span>Volume</span><span><input id="volume" type="range" min="0" max="1" step=".05"><button id="btSom">Testar</button></span></div>
  </section>
  <section class="aba" id="aba-kuma" hidden>
    <label class="switch-line"><span>Ativar Uptime Kuma</span><input id="kAtivo" type="checkbox"></label>
    <label>URL base</label><input id="kUrl" placeholder="https://status.exemplo.com">
    <label>API key</label><input id="kToken" type="password" placeholder="deixe vazio para manter" autocomplete="off">
    <label>Slug da página pública <span class="meta">opcional, fallback de uptime 24h</span></label><input id="kSlug" placeholder="status">
    <label>Avisar expiração com antecedência (dias)</label><input id="kDias" type="number" min="1" max="365">
    <div class="acoes"><button id="btTestKuma">Testar e listar monitores</button><span class="obs" id="kTeste"></span></div><div class="monitor-lista" id="kMonitores"></div>
  </section>
  <section class="aba" id="aba-webhook" hidden>
    <label class="switch-line"><span>Ativar envio contínuo</span><input id="wAtivo" type="checkbox"></label>
    <label>URL de destino</label><input id="wUrl" placeholder="https://exemplo.com/webhook">
    <label>Bearer token</label><input id="wBearer" type="password" placeholder="opcional; deixe vazio para manter" autocomplete="off">
    <div class="acoes"><button id="btTestWebhook">Enviar teste</button><span class="obs" id="wTeste"></span></div>
  </section>
  <div class="linha-btn"><button id="btFecharConfig">Fechar</button><button id="btSalvar">Salvar</button></div>
</div></dialog>

<dialog id="dlgUptime"><div class="dlg"><h3>Serviços monitorados</h3><div class="obs" id="uptimeObs"></div><table class="modal-table" id="tbUptime"></table><div class="linha-btn"><button data-close="dlgUptime">Fechar</button></div></div></dialog>
<dialog id="dlgCron"><div class="dlg"><h3>Agendamentos: configurado × executou</h3><table class="modal-table" id="tbCron"></table><div class="linha-btn"><button data-close="dlgCron">Fechar</button></div></div></dialog>

<script src="/toasts.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const nf=n=>new Intl.NumberFormat('pt-BR').format(n||0), hora=i=>i?new Date(i).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'
const dur=m=>{const s=Math.max(0,Math.round((m||0)*60)),h=Math.floor(s/3600),mm=Math.floor((s%3600)/60);return h?`${h}h ${String(mm).padStart(2,'0')}m`:mm?`${mm}m`:`${s}s`}
let ultimo=null, config=null, primeira=true, pausado=false, filtro=new Set(), monitoresTeste=[]
const ROT={ligado:'Ligado',desligado:'Desligado',manutencao:'Manutenção',desconhecido:'Desconhecido',pausado:'Pausado'}

function tagsInstancias(instancias){
  $('#fInst').innerHTML=instancias.length>1?'<span class="rot">Instâncias</span>'+instancias.map(i=>`<button class="tag ${filtro.has(i.id)?'on':''}" data-fi="${esc(i.id)}">${esc(i.nome)}</button>`).join(''):''
  document.querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{filtro.has(b.dataset.fi)?filtro.delete(b.dataset.fi):filtro.add(b.dataset.fi);render();tagsInstancias(instancias)})
}
const pertence=x=>!filtro.size||!x.instanciaId||filtro.has(x.instanciaId)
function render(){if(!ultimo)return;const A=(ultimo.alertas||[]).filter(pertence),graves=A.filter(a=>a.nivel==='ruim').length,avisos=A.length-graves,nivel=graves?'ruim':avisos?'atencao':'ok'
  $('#topo').className='topo '+nivel;$('#status').className=nivel;$('#statusNome').textContent=graves?'erro':avisos?'atenção':'tudo ok';$('#icone').textContent=graves?'×':avisos?'!':'✓';$('#numero').textContent=A.length||'';$('#titulo').textContent=A.length?(A.length===1?'precisa de atenção':'precisam de atenção'):'Tudo em ordem';const resumoAlertas=A.map(a=>a.resumo).join(' · '),resumoEl=$('#resumo');resumoEl.textContent=resumoAlertas;resumoEl.title=resumoAlertas;$('#quando').textContent=hora(ultimo.momento);$('#contaProb').textContent=A.length?`${A.length} item(ns)`:'';$('#tarefasN').textContent=Object.values(ultimo.tarefasContagem||{}).reduce((n,v)=>n+v,0)||''
  $('#problemas').innerHTML=A.length?A.map(a=>`<article class="prob ${a.nivel}"><div class="prob-top"><span class="tipo">${esc(a.tipo)}</span>${a.instancia?`<span class="tag">${esc(a.instancia)}</span>`:''}<span class="tag">×${nf(a.magnitude)}</span></div><h3>${esc(a.titulo)}</h3><div class="det">${esc(a.detalhe||'')}</div>${a.mensagem?`<div class="mono">${esc(a.mensagem)}</div>`:''}<div class="acoes">${a.copiarGrupo!=null?`<button data-diag="${a.copiarGrupo}">Copiar diagnóstico</button>`:''}<button data-rec="resolvido" data-key="${esc(a.chave)}">Resolvido</button><button data-rec="analise" data-key="${esc(a.chave)}">Em análise</button>${a.link?`<a href="${esc(a.link)}" target="_blank">abrir origem →</a>`:''}</div></article>`).join(''):'<div class="vazio"><div style="font-size:32px;color:var(--bom)">✓</div><div>Nenhum problema ativo.</div></div>'
  const t=ultimo.tiles||{};$('#nums').innerHTML=[['erros/h',t.errosHora,t.errosHora?'mal':'bem'],['execuções/h',(t.truncado?'≥':'')+nf(t.execucoesHora),''],['rodando',t.rodando,''],['travadas',t.travadas,t.travadas?'aviso':'bem']].map(x=>`<div class="num ${x[2]}"><div class="r">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')
  const R=(ultimo.rodando||[]).filter(pertence);$('#contaAndando').textContent=R.length||'';$('#andando').innerHTML=R.length?R.map(e=>`<div class="exec"><span class="girando"></span><span class="tempo" data-inicio="${esc(e.inicio)}">${dur(e.minutos)}</span><span class="nome">${e.instancia?`<span class="tag">${esc(e.instancia)}</span> `:''}${esc(e.fluxo)}</span></div>`).join(''):'<div class="sub2">Nada em execução agora.</div>'
  renderUptime(ultimo.uptime);renderCron(ultimo.cron)
  if(!primeira)A.forEach(a=>Toaster.alertar({chave:a.chave,nivel:a.nivel,tipo:a.tipo,titulo:a.titulo,det:esc(a.detalhe||''),marca:a.instancia,magnitude:a.magnitude,link:a.link}));primeira=false
}
function renderUptime(u){if(!u?.ok){$('#uptime').innerHTML=`<div class="sub2">${u?.motivo==='desligado'?'Integração desativada.':'Sem dados do Uptime Kuma.'}</div>`;return}$('#uptime').innerHTML='<div class="uptime-resumo">'+Object.keys(ROT).map(k=>`<div class="uptime-kpi"><b>${nf(u.resumo?.[k])}</b><span>${ROT[k]}</span></div>`).join('')+'</div>';$('#uptimeObs').textContent=`${u.monitores.filter(m=>m.ativo).length} ativos · expiração avisada em ${u.limiteCertDias} dias`;$('#tbUptime').innerHTML='<thead><tr><th>Serviço</th><th>Status</th><th>Uptime 24h</th><th>Resposta</th><th>TLS</th><th>Domínio</th></tr></thead><tbody>'+u.monitores.filter(m=>m.ativo).map(m=>{const dom=(u.dominios||[]).find(d=>m.alvo?.includes(d.dominio));return `<tr><td>${esc(m.nome)}<div class="sub2">${esc(m.alvo||m.tipo||'')}</div></td><td><span class="estado"><i class="dot ${m.situacao}"></i>${ROT[m.situacao]}</span></td><td>${m.uptime24==null?'—':(m.uptime24*100).toFixed(2)+'%'}</td><td>${m.respostaMs==null?'—':m.respostaMs+'ms'}</td><td>${m.certDias==null?'—':m.certDias+'d'}</td><td>${dom?dom.dias+'d':'—'}</td></tr>`}).join('')+'</tbody>'}
function renderCron(c){if(!c?.ok){$('#cronResumo').innerHTML='<span class="sub2">Sem dados.</span>';return}const n={};c.linhas.forEach(x=>n[x.veredito]=(n[x.veredito]||0)+1);$('#cronResumo').innerHTML='<div class="cron-resumo">'+Object.entries(n).map(([k,v])=>`<span><b>${v}</b> ${esc(k)}</span>`).join('')+'</div>';$('#tbCron').innerHTML='<thead><tr><th>Instância</th><th>Fluxo / nó</th><th>Regra</th><th>Prev.</th><th>Cumpr.</th><th>Situação</th></tr></thead><tbody>'+c.linhas.map(l=>`<tr><td><span class="tag">${esc(l.instancia)}</span></td><td>${esc(l.fluxo)}<div class="sub2">${esc(l.no)}</div></td><td>${esc(l.regra)}</td><td>${l.esperado??'—'}</td><td>${l.cumpridas??'—'}</td><td><span class="tag ${l.veredito==='nunca-executou'?'ruim':l.veredito==='com-falhas'?'atencao':''}">${esc(l.veredito)}</span></td></tr>`).join('')+'</tbody>'}
async function puxar(force=false){if(pausado)return;try{const d=await(await fetch('/api/state'+(force?'?recarregar=1':''),{cache:'no-store'})).json();if(!d.ok)throw new Error(d.detalhe||d.motivo);ultimo=d;tagsInstancias(d.instancias||[]);render()}catch(e){$('#status').className='ruim';$('#statusNome').textContent='painel offline';$('#titulo').textContent=e.message}}

document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-rec]');if(b){const a=ultimo.alertas.find(x=>x.chave===b.dataset.key);const r=await(await fetch('/api/reconhecer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chave:a.chave,estado:b.dataset.rec,magnitude:a.magnitude,alerta:a})})).json();if(r.ok){Toaster.fechar(a.chave);await puxar(true)}}const d=ev.target.closest('[data-diag]');if(d){const a=ultimo.alertas.find(x=>x.copiarGrupo===Number(d.dataset.diag));const r=await(await fetch(`/api/execucao?id=${encodeURIComponent(a.executionId)}&instancia=${encodeURIComponent(a.instanciaId)}`)).json();await navigator.clipboard.writeText(r.diagnostico||r.erro||'');d.textContent='Copiado ✓'}const c=ev.target.closest('[data-close]');if(c)document.getElementById(c.dataset.close).close()})

function instRow(i={id:'',nome:'',baseUrl:'',temChave:false,ativo:true}){const el=document.createElement('div');el.className='inst-row';el.dataset.id=i.id;el.innerHTML=`<input data-f="ativo" type="checkbox" ${i.ativo?'checked':''}><input data-f="nome" value="${esc(i.nome)}" placeholder="Nome"><input data-f="baseUrl" value="${esc(i.baseUrl)}" placeholder="URL base"><input data-f="apiKey" type="password" placeholder="${i.temChave?'chave salva; vazio mantém':'API key'}" autocomplete="off"><button data-test-inst>Testar</button><button data-remove-inst aria-label="Remover">×</button>`;el.querySelector('[data-remove-inst]').onclick=()=>el.remove();el.querySelector('[data-test-inst]').onclick=async ev=>{const x=lerInst(el),b=ev.target;b.textContent='…';const r=await(await fetch('/api/teste',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)})).json();b.textContent=r.ok?'OK ✓':'Falhou';b.title=r.erro||''};return el}
function lerInst(el){const g=f=>el.querySelector(`[data-f=${f}]`);return{id:el.dataset.id,nome:g('nome').value,baseUrl:g('baseUrl').value,apiKey:g('apiKey').value,ativo:g('ativo').checked}}
function listarMonitores(ms,sel={}){monitoresTeste=ms||[];$('#kMonitores').innerHTML=monitoresTeste.length?monitoresTeste.map(m=>{const id=m.id||m.chave,ativo=sel[id]!==false;return `<label class="monitor-op"><input type="checkbox" data-mid="${esc(id)}" ${ativo?'checked':''}><span>${esc(m.nome)}</span><span class="tag">${ROT[m.situacao]||m.situacao}</span><span class="monitor-vinculo ${ativo?'':'fora'}">${ativo?'No Monitor':'Fora do Monitor'}</span><span class="alvo" title="${esc(m.alvo||'')}">${esc(m.alvo||'')}</span></label>`}).join(''):'<div class="vazio">Nenhum monitor encontrado.</div>';document.querySelectorAll('[data-mid]').forEach(x=>x.onchange=()=>{const v=x.closest('.monitor-op').querySelector('.monitor-vinculo');v.textContent=x.checked?'No Monitor':'Fora do Monitor';v.classList.toggle('fora',!x.checked)})}
function selecaoMonitores(){const xs=[...document.querySelectorAll('[data-mid]')];return xs.length?Object.fromEntries(xs.map(x=>[x.dataset.mid,x.checked])):config.uptimeKuma.monitores}
async function carregarMonitoresKuma(sel=config.uptimeKuma.monitores){if(!$('#kUrl').value||(!config.uptimeKuma.temToken&&!$('#kToken').value)){$('#kTeste').textContent='Configure URL e API key para listar os monitores.';listarMonitores([],sel);return}$('#kTeste').textContent='carregando monitores…';$('#kMonitores').innerHTML='<div class="vazio">Carregando monitores…</div>';const r=await(await fetch('/api/uptime/teste',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({baseUrl:$('#kUrl').value,token:$('#kToken').value,slug:$('#kSlug').value})})).json();$('#kTeste').textContent=r.ok?`${r.monitores.length} monitores encontrados`:`Falhou: ${r.detalhe||r.motivo}`;if(r.ok)listarMonitores(r.monitores,sel);else $('#kMonitores').innerHTML='<div class="vazio">Não foi possível carregar os monitores.</div>'}
async function abrirConfig(){config=await(await fetch('/api/config')).json();$('#caminho').textContent=`Dados protegidos em ${config.caminhoConfig}`;$('#instancias').innerHTML='';config.instancias.forEach(i=>$('#instancias').appendChild(instRow(i)));const n=config.notificacoes;$('#toastSeg').value=n.toastSeg;$('#toastVal').textContent=n.toastSeg?n.toastSeg+'s':'manual';$('#notifNav').checked=n.navegador;$('#notifSom').checked=n.som;$('#volume').value=n.volume;const k=config.uptimeKuma;$('#kAtivo').checked=k.ativo;$('#kUrl').value=k.baseUrl;$('#kToken').value='';$('#kSlug').value=k.slug;$('#kDias').value=k.avisarCertDias;const w=config.webhook;$('#wAtivo').checked=w.ativo;$('#wUrl').value=w.url;$('#wBearer').value='';$('#wTeste').textContent=w.ultimo?`${w.ultimo.ok?'OK':'Falha'} · ${w.ultimo.detalhe}`:'';$('#dlgConfig').showModal();carregarMonitoresKuma(k.monitores)}
$('#tabs').onclick=ev=>{const b=ev.target.closest('[data-aba]');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.aba').forEach(x=>x.hidden=x.id!==`aba-${b.dataset.aba}`)}
$('#btAddInst').onclick=()=>$('#instancias').appendChild(instRow({nome:`n8n ${$('#instancias').children.length+1}`,ativo:true}));$('#toastSeg').oninput=ev=>$('#toastVal').textContent=ev.target.value==='0'?'manual':ev.target.value+'s';$('#btSom').onclick=()=>Toaster.testarSom($('#volume').value)
$('#btTestKuma').onclick=()=>carregarMonitoresKuma(selecaoMonitores())
$('#btTestWebhook').onclick=async()=>{$('#wTeste').textContent='enviando…';const r=await(await fetch('/api/webhook/teste',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:$('#wUrl').value,bearer:$('#wBearer').value})})).json();$('#wTeste').textContent=r.ok?'Entregue com sucesso ✓':`Falhou: ${r.erro}`}
$('#btSalvar').onclick=async()=>{const mon={};document.querySelectorAll('[data-mid]').forEach(x=>mon[x.dataset.mid]=x.checked);const corpo={instancias:[...$('#instancias').children].map(lerInst),notificacoes:{toastSeg:Number($('#toastSeg').value),navegador:$('#notifNav').checked,som:$('#notifSom').checked,volume:Number($('#volume').value)},uptimeKuma:{ativo:$('#kAtivo').checked,baseUrl:$('#kUrl').value,token:$('#kToken').value,slug:$('#kSlug').value,avisarCertDias:Number($('#kDias').value),monitores:mon},webhook:{ativo:$('#wAtivo').checked,url:$('#wUrl').value,bearer:$('#wBearer').value}};await fetch('/api/config',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(corpo)});Toaster.configurar(corpo.notificacoes);$('#dlgConfig').close();await puxar(true)}
$('#btConfig').onclick=abrirConfig;$('#btFecharConfig').onclick=()=>$('#dlgConfig').close();$('#btUptime').onclick=()=>$('#dlgUptime').showModal();$('#btCron').onclick=()=>$('#dlgCron').showModal();$('#btPausa').onclick=ev=>{pausado=!pausado;ev.target.textContent=pausado?'Retomar':'Pausar';if(!pausado)puxar()}
setInterval(()=>document.querySelectorAll('[data-inicio]').forEach(e=>e.textContent=dur((Date.now()-new Date(e.dataset.inicio))/60000)),1000)
fetch('/api/config').then(r=>r.json()).then(c=>Toaster.configurar(c.notificacoes));puxar();setInterval(puxar,10000)
</script>
